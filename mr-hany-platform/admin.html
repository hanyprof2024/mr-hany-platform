<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة المعلم — أكاديمية مستر هاني</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .tabs { display:flex; gap:8px; overflow-x:auto; margin-bottom:18px; }
  .tab { padding:9px 16px; border-radius:10px; background:var(--glass); border:1px solid var(--glass-border); cursor:pointer; white-space:nowrap; font-size:14px; }
  .tab.active { background:linear-gradient(135deg, var(--gold), #e0973c); color:#1a1200; font-weight:700; border-color:transparent; }
  .section { display:none; }
  .section.active { display:block; }
  .list-item { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--glass-border); font-size:14px; }
  .list-item:last-child { border-bottom:none; }
  .del { color:var(--coral); cursor:pointer; font-size:13px; }
  .choice-input { display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  .choice-input input[type=radio]{ width:auto; margin:0; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="mark">هـ</span> لوحة المعلم</div>
  <button class="btn btn-ghost" id="logoutBtn" style="padding:6px 14px; font-size:13px; display:none;">خروج</button>
</div>

<div class="wrap" style="max-width:720px;">

  <!-- تسجيل دخول المعلم -->
  <div class="glass card" id="loginBox" style="max-width:380px; margin:30px auto;">
    <h2>دخول المعلم</h2>
    <p class="muted" style="margin-bottom:14px;">سجّل حساب المعلم أول مرة من Supabase Dashboard (Authentication → Users → Add user)</p>
    <label>الإيميل</label>
    <input id="email" type="email">
    <label>كلمة السر</label>
    <input id="password" type="password">
    <button class="btn btn-primary btn-block" id="signInBtn">دخول</button>
    <p id="loginErr" class="muted" style="color:var(--coral); display:none;"></p>
  </div>

  <!-- محتوى اللوحة -->
  <div id="adminBox" style="display:none;">
    <div class="tabs">
      <div class="tab active" data-tab="classes">الفصول</div>
      <div class="tab" data-tab="students">الطلاب</div>
      <div class="tab" data-tab="courses">الكورسات</div>
      <div class="tab" data-tab="lessons">الدروس</div>
      <div class="tab" data-tab="questions">الأسئلة</div>
    </div>

    <!-- الفصول -->
    <div class="section active" id="sec-classes">
      <div class="glass card">
        <h2>إضافة فصل</h2>
        <input id="className" placeholder="مثال: تالتة إعدادي - فصل أ">
        <button class="btn btn-primary" id="addClassBtn">إضافة</button>
      </div>
      <div class="glass card"><div id="classList"></div></div>
    </div>

    <!-- الطلاب -->
    <div class="section" id="sec-students">
      <div class="glass card">
        <h2>إضافة طالب</h2>
        <label>الفصل</label>
        <select id="studentClass"></select>
        <input id="studentName" placeholder="اسم الطالب (اختياري، هيدخله هو بنفسه)">
        <input id="studentPhone" placeholder="رقم هاتف ولي الأمر (اختياري)">
        <p class="muted" style="margin:-4px 0 10px;">كود الدخول هيتولّد تلقائي</p>
        <button class="btn btn-primary" id="addStudentBtn">إضافة الطالب</button>
      </div>
      <div class="glass card"><div id="studentList"></div></div>
    </div>

    <!-- الكورسات -->
    <div class="section" id="sec-courses">
      <div class="glass card">
        <h2>إضافة كورس</h2>
        <label>الفصل</label>
        <select id="courseClass"></select>
        <input id="courseTitle" placeholder="عنوان الكورس/الوحدة">
        <button class="btn btn-primary" id="addCourseBtn">إضافة</button>
      </div>
      <div class="glass card"><div id="courseList"></div></div>
    </div>

    <!-- الدروس -->
    <div class="section" id="sec-lessons">
      <div class="glass card">
        <h2>إضافة درس</h2>
        <label>الكورس</label>
        <select id="lessonCourse"></select>
        <input id="lessonTitle" placeholder="عنوان الدرس">
        <input id="lessonVideoId" placeholder="كود فيديو يوتيوب (اللي بعد v=)">
        <input id="lessonReading" placeholder="رابط القراءة المصاحبة (اختياري)">
        <button class="btn btn-primary" id="addLessonBtn">إضافة</button>
      </div>
      <div class="glass card"><div id="lessonList"></div></div>
    </div>

    <!-- الأسئلة -->
    <div class="section" id="sec-questions">
      <div class="glass card">
        <h2>إضافة سؤال على فيديو</h2>
        <label>الدرس</label>
        <select id="questionLesson"></select>
        <input id="qSecond" type="number" placeholder="ثانية ظهور السؤال (مثال: 90)">
        <input id="qPrompt" placeholder="نص السؤال">
        <div id="choicesBox">
          <div class="choice-input"><input type="radio" name="correct" value="0" checked><input placeholder="اختيار 1"></div>
          <div class="choice-input"><input type="radio" name="correct" value="1"><input placeholder="اختيار 2"></div>
          <div class="choice-input"><input type="radio" name="correct" value="2"><input placeholder="اختيار 3"></div>
          <div class="choice-input"><input type="radio" name="correct" value="3"><input placeholder="اختيار 4"></div>
        </div>
        <p class="muted" style="margin:4px 0 10px;">حدد دائرة الاختيار الصحيح</p>
        <input id="qPoints" type="number" value="10" placeholder="عدد النقاط">
        <button class="btn btn-primary" id="addQuestionBtn">إضافة السؤال</button>
      </div>
      <div class="glass card"><div id="questionList"></div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast" style="display:none;"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script>
let classes = [], courses = [], lessons = [];

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  setTimeout(() => t.style.display = "none", 1800);
}

// ---- تسجيل الدخول ----
document.getElementById("signInBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  const errEl = document.getElementById("loginErr");
  if (error) { errEl.textContent = "بيانات دخول غير صحيحة"; errEl.style.display = "block"; return; }
  enterAdmin();
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await supabaseClient.auth.signOut();
  location.reload();
});

async function checkAuth() {
  const { data } = await supabaseClient.auth.getSession();
  if (data.session) enterAdmin();
}

function enterAdmin() {
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("adminBox").style.display = "block";
  document.getElementById("logoutBtn").style.display = "inline-block";
  loadAll();
}

// ---- تبديل التابات ----
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById("sec-" + tab.dataset.tab).classList.add("active");
  });
});

// ---- تحميل كل البيانات ----
async function loadAll() {
  await loadClasses();
  await loadCourses();
  await loadLessons();
  await loadStudents();
  await loadQuestions();
}

async function loadClasses() {
  const { data } = await supabaseClient.from("classes").select("*").order("created_at");
  classes = data || [];
  document.getElementById("classList").innerHTML = classes.map(c =>
    `<div class="list-item"><span>${c.name}</span><span class="del" onclick="delRow('classes','${c.id}')">حذف</span></div>`
  ).join("") || '<p class="muted">مفيش فصول لسه</p>';

  const opts = classes.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
  document.getElementById("studentClass").innerHTML = opts;
  document.getElementById("courseClass").innerHTML = opts;
}

async function loadCourses() {
  const { data } = await supabaseClient.from("courses").select("*, classes(name)").order("created_at");
  courses = data || [];
  document.getElementById("courseList").innerHTML = courses.map(c =>
    `<div class="list-item"><span>${c.title} <span class="muted">(${c.classes?.name || ""})</span></span><span class="del" onclick="delRow('courses','${c.id}')">حذف</span></div>`
  ).join("") || '<p class="muted">مفيش كورسات لسه</p>';

  document.getElementById("lessonCourse").innerHTML =
    courses.map(c => `<option value="${c.id}">${c.title}</option>`).join("");
}

async function loadLessons() {
  const { data } = await supabaseClient.from("lessons").select("*, courses(title)").order("created_at");
  lessons = data || [];
  document.getElementById("lessonList").innerHTML = lessons.map(l =>
    `<div class="list-item"><span>${l.title} <span class="muted">(${l.courses?.title || ""})</span></span><span class="del" onclick="delRow('lessons','${l.id}')">حذف</span></div>`
  ).join("") || '<p class="muted">مفيش دروس لسه</p>';

  document.getElementById("questionLesson").innerHTML =
    lessons.map(l => `<option value="${l.id}">${l.title}</option>`).join("");
}

async function loadStudents() {
  const { data } = await supabaseClient.from("students").select("*, classes(name)").order("created_at");
  document.getElementById("studentList").innerHTML = (data || []).map(s =>
    `<div class="list-item"><span>${s.full_name || "(لسه مسجلش)"} — كود: <b>${s.access_code}</b> <span class="muted">(${s.classes?.name || ""})</span></span><span class="del" onclick="delRow('students','${s.id}')">حذف</span></div>`
  ).join("") || '<p class="muted">مفيش طلاب لسه</p>';
}

async function loadQuestions() {
  const { data } = await supabaseClient.from("questions").select("*, lessons(title)").order("created_at", {ascending:false});
  document.getElementById("questionList").innerHTML = (data || []).map(q =>
    `<div class="list-item"><span>${q.prompt} <span class="muted">— ث${q.trigger_second} — (${q.lessons?.title || ""})</span></span><span class="del" onclick="delRow('questions','${q.id}')">حذف</span></div>`
  ).join("") || '<p class="muted">مفيش أسئلة لسه</p>';
}

async function delRow(table, id) {
  if (!confirm("متأكد من الحذف؟")) return;
  await supabaseClient.from(table).delete().eq("id", id);
  loadAll();
}

// ---- إضافة فصل ----
document.getElementById("addClassBtn").addEventListener("click", async () => {
  const name = document.getElementById("className").value.trim();
  if (!name) return;
  await supabaseClient.from("classes").insert({ name });
  document.getElementById("className").value = "";
  showToast("تم إضافة الفصل");
  loadClasses();
});

// ---- إضافة طالب ----
function genCode() {
  return Math.random().toString(36).substring(2, 8).toUpperCase();
}
document.getElementById("addStudentBtn").addEventListener("click", async () => {
  const class_id = document.getElementById("studentClass").value;
  const full_name = document.getElementById("studentName").value.trim();
  const parent_phone = document.getElementById("studentPhone").value.trim();
  if (!class_id) { showToast("أضف فصل الأول"); return; }
  await supabaseClient.from("students").insert({
    class_id, full_name, parent_phone, access_code: genCode()
  });
  document.getElementById("studentName").value = "";
  document.getElementById("studentPhone").value = "";
  showToast("تم إضافة الطالب");
  loadStudents();
});

// ---- إضافة كورس ----
document.getElementById("addCourseBtn").addEventListener("click", async () => {
  const class_id = document.getElementById("courseClass").value;
  const title = document.getElementById("courseTitle").value.trim();
  if (!class_id || !title) return;
  await supabaseClient.from("courses").insert({ class_id, title });
  document.getElementById("courseTitle").value = "";
  showToast("تم إضافة الكورس");
  loadCourses();
});

// ---- إضافة درس ----
document.getElementById("addLessonBtn").addEventListener("click", async () => {
  const course_id = document.getElementById("lessonCourse").value;
  const title = document.getElementById("lessonTitle").value.trim();
  const youtube_video_id = document.getElementById("lessonVideoId").value.trim();
  const reading_url = document.getElementById("lessonReading").value.trim();
  if (!course_id || !title || !youtube_video_id) { showToast("أكمل بيانات الدرس"); return; }
  await supabaseClient.from("lessons").insert({ course_id, title, youtube_video_id, reading_url: reading_url || null });
  document.getElementById("lessonTitle").value = "";
  document.getElementById("lessonVideoId").value = "";
  document.getElementById("lessonReading").value = "";
  showToast("تم إضافة الدرس");
  loadLessons();
});

// ---- إضافة سؤال ----
document.getElementById("addQuestionBtn").addEventListener("click", async () => {
  const lesson_id = document.getElementById("questionLesson").value;
  const trigger_second = parseInt(document.getElementById("qSecond").value);
  const prompt = document.getElementById("qPrompt").value.trim();
  const points = parseInt(document.getElementById("qPoints").value) || 10;
  const correctIdx = parseInt(document.querySelector('input[name="correct"]:checked').value);
  const choiceInputs = document.querySelectorAll("#choicesBox .choice-input input[type=text], #choicesBox .choice-input input:not([type=radio])");
  const choices = Array.from(choiceInputs).map(i => i.value.trim()).filter(Boolean);

  if (!lesson_id || isNaN(trigger_second) || !prompt || choices.length < 2) {
    showToast("أكمل بيانات السؤال"); return;
  }

  await supabaseClient.from("questions").insert({
    lesson_id, trigger_second, prompt, choices, correct_index: correctIdx, points
  });

  document.getElementById("qSecond").value = "";
  document.getElementById("qPrompt").value = "";
  document.querySelectorAll("#choicesBox input:not([type=radio])").forEach(i => i.value = "");
  showToast("تم إضافة السؤال");
  loadQuestions();
});

checkAuth();
</script>
</body>
</html>
