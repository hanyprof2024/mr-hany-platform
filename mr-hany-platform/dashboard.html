<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خطتي الدراسية — أكاديمية مستر هاني</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="mark">هـ</span> أكاديمية مستر هاني</div>
  <div class="row">
    <a href="leaderboard.html" class="pill">🏆 لوحة الصدارة</a>
    <button class="btn btn-ghost" id="logoutBtn" style="padding:6px 14px; font-size:13px;">خروج</button>
  </div>
</div>

<div class="wrap">
  <div class="glass card row between" style="margin-bottom:22px;">
    <div>
      <h2 id="studentName">—</h2>
      <p class="muted">استمر في المشاهدة والإجابة عشان تزود رصيدك من النقاط</p>
    </div>
    <div style="text-align:center;">
      <div style="font-size:26px; font-weight:900; color:var(--gold);" id="pointsVal">0</div>
      <div class="muted" style="font-size:12px;">نقطة</div>
    </div>
  </div>

  <h2 style="margin-bottom:12px;">📚 دروسك</h2>
  <div id="lessonsList">
    <p class="muted">جاري التحميل...</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script>
const student = requireSession();
document.getElementById("studentName").textContent = "أهلاً، " + student.full_name;
document.getElementById("pointsVal").textContent = student.total_points || 0;

document.getElementById("logoutBtn").addEventListener("click", () => {
  clearSession();
  window.location.href = "index.html";
});

async function loadLessons() {
  const list = document.getElementById("lessonsList");

  const { data: courses } = await supabaseClient
    .from("courses")
    .select("id, title, sort_order")
    .eq("class_id", student.class_id)
    .order("sort_order");

  if (!courses || courses.length === 0) {
    list.innerHTML = '<p class="muted">لسه معملهاش المعلم كورسات لفصلك. تابعنا قريب!</p>';
    return;
  }

  const courseIds = courses.map(c => c.id);
  const { data: lessons } = await supabaseClient
    .from("lessons")
    .select("id, title, youtube_video_id, reading_url, course_id, sort_order")
    .in("course_id", courseIds)
    .order("sort_order");

  const { data: progress } = await supabaseClient
    .from("lesson_progress")
    .select("lesson_id, completed")
    .eq("student_id", student.id);

  const doneMap = {};
  (progress || []).forEach(p => { doneMap[p.lesson_id] = p.completed; });

  list.innerHTML = "";
  courses.forEach(course => {
    const courseLessons = (lessons || []).filter(l => l.course_id === course.id);
    if (courseLessons.length === 0) return;

    const section = document.createElement("div");
    section.innerHTML = `<h2 style="margin:20px 0 10px; color:var(--text-1); font-size:15px;">${course.title}</h2>`;
    list.appendChild(section);

    courseLessons.forEach(lesson => {
      const done = doneMap[lesson.id];
      const card = document.createElement("a");
      card.href = `lesson.html?id=${lesson.id}`;
      card.className = "glass card";
      card.style.display = "block";
      card.innerHTML = `
        <div class="row between">
          <div class="row">
            <img src="https://i.ytimg.com/vi/${lesson.youtube_video_id}/mqdefault.jpg"
                 style="width:100px; border-radius:10px; aspect-ratio:16/9; object-fit:cover;">
            <div>
              <h2 style="font-size:16px;">${lesson.title}</h2>
              <p class="muted">${lesson.reading_url ? "📖 فيه قراءة مصاحبة" : "🎬 فيديو فقط"}</p>
            </div>
          </div>
          <span class="pill" style="background:${done ? 'rgba(53,214,165,.18)' : 'rgba(255,255,255,.08)'}; color:${done ? 'var(--teal)' : 'var(--text-1)'};">
            ${done ? "✓ خلصت" : "ابدأ"}
          </span>
        </div>`;
      list.appendChild(card);
    });
  });

  if (list.innerHTML === "") {
    list.innerHTML = '<p class="muted">لسه مفيش دروس متاحة، تابعنا قريب!</p>';
  }
}

loadLessons();
</script>
</body>
</html>
