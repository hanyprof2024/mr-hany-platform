<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أكاديمية مستر هاني — دخول الطالب</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="mark">هـ</span> أكاديمية مستر هاني</div>
  <a href="admin.html" class="pill">دخول المعلم</a>
</div>

<div class="wrap" style="max-width:420px;">
  <div style="text-align:center; margin:30px 0 26px;">
    <h1>أهلاً بيك 👋</h1>
    <p class="muted">ادخل بياناتك عشان تكمل خطتك الدراسية وتجمع نقاط</p>
  </div>

  <div class="glass card">
    <label>الاسم بالكامل</label>
    <input id="fullName" placeholder="اكتب اسمك" autocomplete="off">

    <label>كود الدخول</label>
    <input id="accessCode" placeholder="الكود اللي أخدته من المعلم" autocomplete="off">

    <button class="btn btn-primary btn-block" id="loginBtn">ابدأ الدروس ←</button>
    <p id="errMsg" class="muted" style="color:var(--coral); display:none; margin-top:10px;"></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script>
const loginBtn = document.getElementById("loginBtn");
const errMsg = document.getElementById("errMsg");

// لو عنده جلسة محفوظة، وديه على طول للوحة
if (getSession()) window.location.href = "dashboard.html";

loginBtn.addEventListener("click", async () => {
  const fullName = document.getElementById("fullName").value.trim();
  const code = document.getElementById("accessCode").value.trim();
  errMsg.style.display = "none";

  if (!fullName || !code) {
    errMsg.textContent = "من فضلك اكتب اسمك وكود الدخول";
    errMsg.style.display = "block";
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "جاري الدخول...";

  const { data, error } = await supabaseClient
    .from("students")
    .select("*")
    .eq("access_code", code)
    .maybeSingle();

  loginBtn.disabled = false;
  loginBtn.textContent = "ابدأ الدروس ←";

  if (error || !data) {
    errMsg.textContent = "الكود غير صحيح، تأكد منه أو اسأل المعلم";
    errMsg.style.display = "block";
    return;
  }

  // لو الاسم فاضي في السجل (أول دخول) سجّله
  if (!data.full_name || data.full_name === "") {
    await supabaseClient.from("students").update({ full_name: fullName }).eq("id", data.id);
    data.full_name = fullName;
  }

  saveSession(data);
  window.location.href = "dashboard.html";
});
</script>
</body>
</html>
